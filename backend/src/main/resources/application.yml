server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,text/javascript
    min-response-size: 1024

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=5m
  servlet:
    multipart:
      # 音频导入需要更大体积上限
      max-file-size: 100MB
      max-request-size: 110MB
  datasource:
    # 读取服务器 unit 注入的 DB_URL（指向线上 chuxi 库），本地缺省回退 chuxi_db
    url: ${DB_URL:jdbc:mysql://localhost:3306/chuxi_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  # 网站2 暂无 Flyway 迁移脚本：线上 schema 变更由人工出具 DDL 执行（见 README「线上 schema 变更流程」），
  # 本地开发库仍由 ddl-auto:update 管理；显式关闭 Flyway 避免与既有 flyway_schema_history 表冲突。
  flyway:
    enabled: false

logging:
  level:
    org.hibernate.SQL: warn

# 阿里云 OSS：配齐 access-key 后上传自动走 OSS；留空则回退本地 uploads/ 目录
# AK/SK 通过环境变量注入（与服务器 systemd unit 的 APP_OSS_* 命名对齐）
aliyun:
  oss:
    enabled: ${APP_OSS_ENABLED:true}
    endpoint: ${APP_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucket: ${APP_OSS_BUCKET:chuxisleep}
    access-key-id: ${APP_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${APP_OSS_ACCESS_KEY_SECRET:}
    # 对象前缀（目录），统一收拢媒体文件（对应服务器 APP_OSS_PREFIX）
    dir: ${APP_OSS_PREFIX:uploads/}
    # 自定义域名（可选，如 CDN 域名）；留空则用 bucket.endpoint 公网地址
    public-host: ${APP_OSS_BASE_URL:}
