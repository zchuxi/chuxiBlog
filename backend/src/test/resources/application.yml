# 测试专用配置：H2 内存库（MySQL 兼容模式）替代 MySQL，mvn test 无需外部依赖
spring:
  datasource:
    url: jdbc:h2:mem:blogtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true

sql:
  init:
    mode: always

# 测试环境不连 OSS，走本地回退分支
aliyun:
  oss:
    enabled: false
    access-key-id: ""
    access-key-secret: ""
